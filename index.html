<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBM Power Virtual Server Synergies Map</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23161616'/%3E%3Ccircle cx='50' cy='50' r='10' fill='%230f62fe'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/app.css?v=powervs-v1">
</head>
<body>
  <div id="app">
    <header class="cds-shell">
      <div class="cds-shell__bar1">
        <div class="cds-shell__brand">
          <span class="cds-shell__wordmark">IBM Cloud</span>
          <span class="cds-shell__divider" aria-hidden="true"></span>
          <span class="cds-shell__product">Power Virtual Server Synergies Map</span>
        </div>
        <nav id="view-switch" class="view-switch" aria-label="Map view"></nav>
        <div class="cds-shell__links">
          <a class="cds-shell__external-link" href="https://ibm-cloud-synergies-map.vercel.app/?view=iaas" target="_blank" rel="noopener noreferrer">
            <span>IBM Cloud IaaS Map</span>
            <svg class="icon-launch" width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M10 2v1.5h2.44L6.97 9.03l1.06 1.06 5.47-5.47V7H15V2h-5z"/>
              <path d="M13 13.5H3v-10h4.5V2H3a1.5 1.5 0 0 0-1.5 1.5v10A1.5 1.5 0 0 0 3 15h10a1.5 1.5 0 0 0 1.5-1.5V9h-1.5v4.5z"/>
            </svg>
          </a>
        </div>
        <div class="cds-shell__meta">
          <span class="cds-shell__meta-text" id="meta-text">PowerVS</span>
          <button type="button" class="cds-shell__theme-btn" id="theme-btn" aria-label="Toggle theme">
            <span class="icon-glyph" aria-hidden="true">◐</span>
          </button>
        </div>
      </div>
      <div class="cds-shell__bar2">
        <div class="search-container">
          <label class="visually-hidden" for="search">Search services</label>
          <input id="search" class="search-input" type="search" placeholder="Search components, OS, storage tiers, backup, replication…" autocomplete="off">
          <button type="button" class="search-clear" id="search-clear" aria-label="Clear search">×</button>
        </div>
        <div class="search-results-count" id="search-count" hidden></div>
        <nav id="play-legend" aria-label="Lane filter"></nav>
      </div>
    </header>

    <div id="main">
      <section id="map-area" aria-label="Connection map">
        <svg id="svg-connections" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="lanes"></div>
        <div id="nodes"></div>
      </section>

      <aside id="sidebar" aria-label="Service detail">
        <div id="sidebar-header">
          <span class="sidebar-title">Detail</span>
          <button type="button" id="reset-btn">Clear selection</button>
        </div>
        <div id="sidebar-inner"></div>
      </aside>
    </div>

    <footer id="footer">
      <div class="footer-stats" id="footer-stats"></div>
      <span class="footer-hint" id="footer-hint">Search components · click a hub, then a lane to filter its integrations</span>
    </footer>
  </div>
  <script type="module" src="./js/app.js?v=powervs-v1"></script>
</body>
</html>
